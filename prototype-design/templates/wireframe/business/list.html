<!-- BUSINESS TEMPLATE: list (列表/管理页) -->
<!-- 主要区块：标题 + 筛选区 + 操作栏 + 表格 + 分页 -->

<!-- Page title -->
<div class="flex items-center justify-between mb-4">
    <div>
        <h1 class="text-xl font-semibold">{{TITLE}}</h1>
        <p class="text-xs text-gray-500 mt-1">关联需求 {{REQ_ID}} · 共 <span class="text-gray-900">128</span> 条记录</p>
    </div>
    <div class="space-x-2">
        <button class="border border-gray-400 px-3 py-1 text-sm">导出</button>
        <button class="border border-gray-900 bg-gray-900 text-white px-3 py-1 text-sm">+ 新增</button>
    </div>
</div>

<!-- 筛选区 -->
<section class="border border-gray-300 p-4 mb-4">
    <div class="grid grid-cols-4 gap-3 text-sm">
        <div>
            <label class="block text-xs text-gray-500 mb-1">关键词</label>
            <input type="text" placeholder="搜索名称/编号" class="w-full border border-gray-400 px-2 py-1 text-sm">
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">状态</label>
            <select class="w-full border border-gray-400 px-2 py-1 text-sm">
                <option>全部</option>
                <option>待处理</option>
                <option>进行中</option>
                <option>已完成</option>
                <option>已驳回</option>
            </select>
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">分类</label>
            <select class="w-full border border-gray-400 px-2 py-1 text-sm">
                <option>全部分类</option>
                <option>分类一</option>
                <option>分类二</option>
            </select>
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">时间范围</label>
            <input type="text" placeholder="2026-01-01 ~ 2026-05-23" class="w-full border border-gray-400 px-2 py-1 text-sm">
        </div>
    </div>
    <div class="mt-3 space-x-2 text-right">
        <button class="border border-gray-400 px-3 py-1 text-sm">重置</button>
        <button class="border border-gray-900 bg-gray-900 text-white px-3 py-1 text-sm">查询</button>
    </div>
</section>

<!-- 数据表 -->
<section class="border border-gray-300 p-4">
    <div class="flex items-center justify-between mb-3">
        <div class="text-xs text-gray-500">已选 <span class="text-gray-900">0</span> 项 · 共 128 条</div>
        <div class="space-x-2 text-xs">
            <button class="border border-gray-400 px-2 py-1">批量删除</button>
            <button class="border border-gray-400 px-2 py-1">批量导出</button>
        </div>
    </div>
    <table class="w-full text-sm border-collapse">
        <thead>
            <tr class="border-b border-gray-300 bg-gray-50 text-left">
                <th class="py-2 px-3 w-8"><input type="checkbox"></th>
                <th class="py-2 px-3">编号</th>
                <th class="py-2 px-3">名称</th>
                <th class="py-2 px-3">提交人</th>
                <th class="py-2 px-3">提交时间</th>
                <th class="py-2 px-3">状态</th>
                <th class="py-2 px-3 w-32">操作</th>
            </tr>
        </thead>
        <tbody>
            <tr class="border-b border-gray-200 hover:bg-gray-50">

                    <a href="#" class="text-xs underline">查看</a>
                    <a href="#" class="text-xs underline">编辑</a>
                </td>
            </tr>
            <tr class="border-b border-gray-200 hover:bg-gray-50">
                <td class="py-2 px-3"><input type="checkbox"></td>
                <td class="py-2 px-3 text-gray-900">2026-0002</td>
                <td class="py-2 px-3">示例条目 二</td>
                <td class="py-2 px-3">李雯</td>
                <td class="py-2 px-3 text-gray-500">2026-05-23 09:48</td>
                <td class="py-2 px-3"><span class="border border-gray-500 bg-gray-100 px-2 py-0.5 text-xs">进行中</span></td>
                <td class="py-2 px-3 space-x-2">
                    <a href="#" class="text-xs underline">查看</a>
                    <a href="#" class="text-xs underline">编辑</a>
                </td>
            </tr>
            <tr class="border-b border-gray-200 hover:bg-gray-50">
                <td class="py-2 px-3"><input type="checkbox"></td>
                <td class="py-2 px-3 text-gray-900">2026-0003</td>

                <td class="py-2 px-3 space-x-2">
                    <a href="#" class="text-xs underline">查看</a>
                </td>
            </tr>
            <tr class="border-b border-gray-200 hover:bg-gray-50">
                <td class="py-2 px-3"><input type="checkbox"></td>
                <td class="py-2 px-3 text-gray-900">2026-0004</td>
                <td class="py-2 px-3">示例条目 四</td>
                <td class="py-2 px-3">赵子涵</td>

                <td class="py-2 px-3 space-x-2">
                    <a href="#" class="text-xs underline">查看</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- 分页 -->
    <div class="flex items-center justify-between mt-4 text-xs text-gray-500">
        <div>共 128 条，每页 20 条</div>
        <nav class="space-x-1">
            <button class="border border-gray-400 px-2 py-1">«</button>
            <button class="border border-gray-900 bg-gray-900 text-white px-2 py-1">1</button>

</section>
